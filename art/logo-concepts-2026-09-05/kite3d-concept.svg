<title id="title">Kite3D — Vector triad</title>
<desc id="desc">Three labelled coordinate vectors meet at a common origin: a flat mathematical diagram for vectors, matrices and spatial maths. A short-tailed geometric kite in Kotlin violet, magenta and orange.</desc>
