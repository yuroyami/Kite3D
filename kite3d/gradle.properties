POM_NAME=Kite3D
POM_DESCRIPTION=3D math for Kotlin Multiplatform - a file-for-file port of three.js r184's src/math layer into common Kotlin. Vectors, matrices, quaternions, Euler angles, bounding volumes, ray/plane/frustum intersection, spherical coordinates, colour management and keyframe interpolants. Math only: no scene graph, no geometry, no renderer. Depends on kotlin-stdlib alone.
