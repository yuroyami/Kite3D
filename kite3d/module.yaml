plugins:
  abi-check:
    enabled: true
    # The committed dumps are api/kite3d.api and api/kite3d.klib.api.
    dumpDir: api
    # The klibAbi check reads the klibs of these platforms, so run `./kotlin build` first.
    klibPlatforms: [ androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, iosArm64, iosSimulatorArm64, iosX64, js, linuxArm64, linuxX64, macosArm64, macosX64, mingwX64, tvosArm64, tvosSimulatorArm64, wasmJs, wasmWasi, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64 ]
  dokka:
    enabled: true
    moduleName: kite3d
    includes: [ Module.md ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: MIT · Kite3D is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/Kite3D/blob/main/kite3d/src
    # `./kotlin do dokkaSite` merges the module pages into build/dokka/html.
    siteName: Kite3D
    siteModules: [ kite3d ]
