name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux runner: tests for JVM, JS, Wasm and linuxX64. `assemble` here skips the Apple
  # targets, because they need Xcode. The apple job builds those.
  linux:
    name: jvm/js/wasm/linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble (non-Apple targets)
        run: ./gradlew assemble --stacktrace
      - name: Test (jvm, js-node, wasmJs-node, wasmWasi-node, linuxX64)
        run: ./gradlew jvmTest jsNodeTest wasmJsNodeTest wasmWasiNodeTest linuxX64Test --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: kite3d/build/reports/tests/

  # Apple runner: the only host that can compile and run the Apple-family targets.
  # It is also the only host that can build every klib in the matrix, so the ABI
  # dump is checked here.
  apple:
    name: apple tests + ABI check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check public ABI against the checked-in dump
        run: ./gradlew :kite3d:checkKotlinAbi --stacktrace
      - name: Assemble Apple targets
        run: ./gradlew assemble --stacktrace
      # macos-latest is arm64, so the x64 and device targets cannot run tests here.
      # `assemble` above compiles them.
      - name: Test (macosArm64, iosSimulatorArm64, tvosSimulatorArm64, watchosSimulatorArm64)
        run: ./gradlew macosArm64Test iosSimulatorArm64Test tvosSimulatorArm64Test watchosSimulatorArm64Test --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-apple
          path: kite3d/build/reports/tests/

  # Windows runner: the only host that can run the mingw native tests.
  windows:
    name: mingw native tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (mingwX64)
        run: ./gradlew mingwX64Test --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: kite3d/build/reports/tests/

  # Docs build. It tests no code, but a broken Dokka run should fail here, not in a release.
  docs:
    name: dokka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate API reference
        run: ./gradlew dokkaGenerate --stacktrace

# Targets whose tests CI does not run:
#   linuxArm64, iosArm64/X64, tvosArm64, watchosArm32/Arm64/DeviceArm64, macosX64,
#   androidNative*: compiled by `assemble` only.
#   jsBrowserTest, wasmJsBrowserTest: the Node tasks already run the same compiled code,
#   and the library has no DOM code, so a browser job adds nothing.
