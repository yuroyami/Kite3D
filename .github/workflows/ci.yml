name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux runner: compiles the whole target matrix and runs every test whose host
  # is Linux/JS/Wasm. Compilation is host-agnostic; only test *execution* is gated
  # on the host, so this job proves all targets compile.
  linux:
    name: build + jvm/js/wasm/linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble all targets
        run: ./gradlew assemble --stacktrace
      - name: Test (jvm, js-node, wasmJs-node, linuxX64)
        run: ./gradlew jvmTest jsNodeTest wasmJsNodeTest linuxX64Test --stacktrace

  # Apple runner: the only host that can run the Apple-family and macos native tests.
  apple:
    name: apple + macos native tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (macosArm64, iosSimulatorArm64)
        run: ./gradlew macosArm64Test iosSimulatorArm64Test --stacktrace

  # Windows runner: the only host that can run the mingw native tests.
  windows:
    name: mingw native tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (mingwX64)
        run: ./gradlew mingwX64Test --stacktrace
