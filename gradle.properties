#Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6G

#Dokka (v2 generator)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

#MPP: suppress the Apple xcode-compatibility notice; the core has no cinterop.
kotlin.apple.xcodeCompatibility.nowarn=true

#MPP: a host can only build the targets its toolchain supports (no Apple targets on
#Linux, for one). Those targets are simply skipped there; CI covers each on its own
#runner, so the per-target warning is noise.
kotlin.native.ignoreDisabledTargets=true

#Kite3D
group=io.github.yuroyami
version=0.1.0

#Maven Central publishing (vanniktech). Shared POM + signing; per-module POM_NAME/POM_DESCRIPTION live in each module's gradle.properties.
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/yuroyami/Kite3D
POM_LICENCE_NAME=The MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_DEVELOPER_ID=yuroyami
POM_DEVELOPER_NAME=yuroyami
POM_DEVELOPER_URL=https://github.com/yuroyami
POM_SCM_URL=https://github.com/yuroyami/Kite3D
POM_SCM_CONNECTION=scm:git:git://github.com/yuroyami/Kite3D.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/yuroyami/Kite3D.git
